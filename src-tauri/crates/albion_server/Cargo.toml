[package]
name = "albion_server"
version = "0.1.0"
edition = "2024"
description = "Project Albion authoritative private-career server."

[dependencies]
albion_protocol = { path = "../albion_protocol" }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
