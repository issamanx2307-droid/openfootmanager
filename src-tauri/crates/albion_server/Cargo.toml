[package]
name = "albion_server"
version = "0.1.0"
edition = "2024"
description = "Project Albion authoritative private-career server."

[dependencies]
albion_protocol = { path = "../albion_protocol" }
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4.45"
domain = { path = "../domain" }
db = { path = "../db" }
engine = { path = "../engine" }
ofm_core = { path = "../ofm_core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "signal", "time"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
